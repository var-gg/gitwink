# Builds the Microsoft Store MSIX bundle via tauri-windows-bundle.
#
# Kept separate from release.yml on purpose: that workflow ships the
# (SignPath/Authenticode-signed) MSI + NSIS installers to GitHub Releases;
# this one produces the .msixbundle and, when repository credentials are
# configured, submits it to Partner Center for Store re-signing. Different
# toolchain, different output dir (src-tauri/target/msix/ vs
# src-tauri/target/release/bundle/) — no collision. The uploaded Actions
# artifact remains the exact manual fallback package if Store submission fails.
name: MSIX (Microsoft Store)

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Reuse the gitwink-msix artifact from this workflow run
        required: false
        type: string
      resume_submission_id:
        description: Resume this exact clean API-created Store draft
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

concurrency:
  group: microsoft-store-production
  cancel-in-progress: false

jobs:
  msix:
    name: Build MSIX bundle
    runs-on: windows-latest
    # Skip prerelease tags (e.g. v0.5.0-rc1); a manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    # Surfaced as an env var so the publish steps below can gate on whether
    # the Partner Center / Entra credentials have been configured yet.
    env:
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      STORE_ARTIFACT_RUN_ID: ${{ github.event.inputs.artifact_run_id || '' }}
      STORE_RESUME_SUBMISSION_ID: ${{ github.event.inputs.resume_submission_id || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install Rust (stable, x64 + arm64)
        if: ${{ env.STORE_ARTIFACT_RUN_ID == '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Cache cargo workspace
        if: ${{ env.STORE_ARTIFACT_RUN_ID == '' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        if: ${{ env.STORE_ARTIFACT_RUN_ID == '' }}
        run: pnpm install --frozen-lockfile

      - name: Validate Store listing assets
        run: pnpm store:listing:check

      # cargo build (the bundler's default runner) does not run Tauri's
      # beforeBuildCommand, so the frontend must be built into dist/
      # explicitly before the Rust binary is compiled and packed.
      - name: Build frontend
        if: ${{ env.STORE_ARTIFACT_RUN_ID == '' }}
        run: pnpm build

      - name: Install msixbundle-cli
        if: ${{ env.STORE_ARTIFACT_RUN_ID == '' }}
        run: cargo install msixbundle-cli

      - name: Build MSIX bundle (x64 + arm64)
        if: ${{ env.STORE_ARTIFACT_RUN_ID == '' }}
        run: pnpm tauri:windows:build --arch x64,arm64 --runner pnpm --verbose

      - name: Upload MSIX bundle
        if: ${{ env.STORE_ARTIFACT_RUN_ID == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gitwink-msix
          path: src-tauri/target/msix/*.msixbundle
          if-no-files-found: error

      - name: Reuse a previously built MSIX bundle
        if: ${{ env.STORE_ARTIFACT_RUN_ID != '' }}
        uses: actions/download-artifact@v4
        with:
          name: gitwink-msix
          path: src-tauri/target/msix
          github-token: ${{ github.token }}
          run-id: ${{ env.STORE_ARTIFACT_RUN_ID }}

      # Auto-submit to the Microsoft Store packaged-app submission API.
      #
      # Gated on the STORE_AUTOPUBLISH repository variable and Entra secrets:
      # forks and credential-free runs still build/upload the MSIX artifact but
      # safely skip publication. `tools/deploy-store.ps1` downloads that exact
      # artifact for a manual Partner Center fallback when an automated publish
      # fails. The wrapper creates exactly one API-owned draft (or resumes an
      # exact, explicitly selected clean API draft), uploads the package and any
      # checked-in locale screenshots in one ZIP, then commits once. Every other
      # existing Partner Center draft remains untouched.
      - name: Submit package and listing assets to the Microsoft Store
        if: ${{ vars.STORE_AUTOPUBLISH == 'true' && env.AZURE_AD_TENANT_ID != '' }}
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $packages = @(Get-ChildItem src-tauri/target/msix/*.msixbundle)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one MSIX bundle, found $($packages.Count)."
          }
          $appVersion = (Get-Content src-tauri/tauri.conf.json -Raw |
            ConvertFrom-Json).version
          $expectedSuffix = "_$appVersion.0.msixbundle"
          if (-not $packages[0].Name.EndsWith(
            $expectedSuffix,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw (
              "MSIX bundle $($packages[0].Name) does not match app version " +
              "$appVersion."
            )
          }
          $parameters = @{
            PackagePath = $packages[0].FullName
            Publish = $true
          }
          if (-not [string]::IsNullOrWhiteSpace($env:STORE_RESUME_SUBMISSION_ID)) {
            $parameters.ResumeSubmissionId = $env:STORE_RESUME_SUBMISSION_ID.Trim()
          }
          & ./tools/publish-store.ps1 @parameters
