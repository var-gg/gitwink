name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Tauri's virtual universal target combines the primary app binary, but
      # additional Cargo binaries must already exist at the universal target
      # path before bundling. Build both real architectures and merge the
      # read-only control CLI explicitly so every macOS app ships a genuine
      # universal gitwinkctl instead of omitting it or copying one architecture.
      - name: Build universal gitwinkctl companion binary
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail

          cargo build \
            --manifest-path src-tauri/Cargo.toml \
            --release \
            --bin gitwinkctl \
            --target aarch64-apple-darwin
          cargo build \
            --manifest-path src-tauri/Cargo.toml \
            --release \
            --bin gitwinkctl \
            --target x86_64-apple-darwin

          output_dir="src-tauri/target/universal-apple-darwin/release"
          mkdir -p "$output_dir"
          lipo -create \
            src-tauri/target/aarch64-apple-darwin/release/gitwinkctl \
            src-tauri/target/x86_64-apple-darwin/release/gitwinkctl \
            -output "$output_dir/gitwinkctl"
          chmod +x "$output_dir/gitwinkctl"
          lipo -verify_arch arm64 x86_64 "$output_dir/gitwinkctl"

      # Pull the CHANGELOG.md section for this tag. It becomes both the
      # GitHub Release body and the `notes` field of `latest.json` — i.e.
      # the changelog the in-app updater modal shows.
      - name: Extract changelog for this tag
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          body=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md)
          if [ -z "$(printf "%s" "$body" | tr -d "[:space:]")" ]; then
            body="See the commit history for changes in this release."
          fi
          {
            echo "body<<__GITWINK_CHANGELOG__"
            printf "%s\n" "$body"
            echo "__GITWINK_CHANGELOG__"
          } >> "$GITHUB_OUTPUT"

      - name: Build + attach to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — tauri-action signs each installer and
          # generates/uploads `latest.json` when these are present.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'gitwink ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          # Matrix jobs upload into one draft. A separate gate validates the
          # merged updater manifest before making the release public, so one
          # failed platform can never leave a partial release marked Latest.
          releaseDraft: true
          # rc/beta tags (v0.6.0-rc1) must publish as prereleases: GitHub
          # excludes those from /releases/latest, which is BOTH the in-app
          # updater endpoint and the README download link. Hardcoding false
          # here would push an rc to the entire install base.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  verify-update-manifest:
    name: Verify update routes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download merged updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --pattern latest.json --output latest.json

      - name: Verify installer-family routes
        shell: bash
        run: node tools/verify-update-manifest.mjs latest.json "${GITHUB_REF_NAME#v}"

  finalize-release:
    name: Publish verified release
    needs: verify-update-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # Open a PR against microsoft/winget-pkgs with the bumped NSIS installer.
  # First-time submission was a manual wingetcreate run; this job keeps it
  # current on every tagged release. Skips if WINGET_TOKEN isn't set (e.g.
  # forks without the secret), so it never blocks a release.
  publish-winget:
    name: Update winget-pkgs manifest
    needs: finalize-release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}  # skip prereleases like v0.4.0-rc1
    steps:
      - name: Submit PR to microsoft/winget-pkgs
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: var-gg.gitwink
          installers-regex: 'gitwink_.*_x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
