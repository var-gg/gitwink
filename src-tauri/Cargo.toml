[package]
name = "gitwink"
default-run = "gitwink"
version = "0.12.0"
description = "Tray-resident, read-only git glance for the AI-agent era."
authors = ["var-gg"]
edition = "2021"
license = "MIT"
repository = "https://github.com/var-gg/gitwink"

[lib]
name = "gitwink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio-util = { version = "0.7", features = ["rt"] }

git2 = { version = "0.19", default-features = false }
ignore = "0.4"
walkdir = "2"
notify = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
sys-locale = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
# Microsoft Store-native update discovery and installation for the packaged
# MSIX build. Keep this target-scoped so macOS builds do not pull WinRT APIs.
windows = { version = "0.61", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Services_Store",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
windows-collections = "0.2"
windows-future = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
